<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03152c">
  <title>NEXUS — Magnetic Compass</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #03152c;
      --panel: #082447;
      --cyan: #31e9ff;
      --cyan-soft: #9bf6ff;
      --muted: #8fa9c4;
      --line: rgba(49, 233, 255, .28);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, #0d4270 0%, rgba(13,66,112,.18) 28%, transparent 53%),
        linear-gradient(145deg, #020b19, var(--navy));
      color: #f2fdff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(92vw, 480px);
      text-align: center;
      padding: 26px 18px 22px;
    }
    .brand {
      margin: 0;
      color: var(--cyan);
      font-size: clamp(2rem, 9vw, 3.15rem);
      letter-spacing: .33em;
      line-height: 1;
      text-indent: .33em;
      text-shadow: 0 0 22px rgba(49,233,255,.58);
    }
    .tagline {
      margin: 10px 0 26px;
      color: var(--muted);
      font-size: .74rem;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .compass {
      width: min(76vw, 340px);
      aspect-ratio: 1;
      margin: 0 auto 23px;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(49,233,255,.12) 0 1%, transparent 1.5%),
        repeating-conic-gradient(from -1.5deg, rgba(155,246,255,.22) 0deg 1deg, transparent 1deg 9deg),
        radial-gradient(circle at center, #0b3159, #041b38 65%, #020d1e);
      box-shadow: inset 0 0 36px rgba(49,233,255,.12), 0 0 32px rgba(15,147,194,.25);
    }
    .compass::before, .compass::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(49,233,255,.12);
      border-radius: 50%;
    }
    .compass::after { inset: 24%; border-color: rgba(49,233,255,.18); }
    .cardinal {
      position: absolute;
      z-index: 2;
      color: var(--cyan-soft);
      font-size: clamp(.75rem, 3.5vw, 1rem);
      font-weight: 700;
      letter-spacing: .08em;
      text-shadow: 0 0 12px rgba(49,233,255,.75);
    }
    .n { top: 7%; left: 50%; transform: translateX(-50%); color: #ff7c8c; }
    .e { top: 50%; right: 7%; transform: translateY(-50%); }
    .s { bottom: 7%; left: 50%; transform: translateX(-50%); }
    .w { top: 50%; left: 7%; transform: translateY(-50%); }
    .needle {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 39%;
      transform: translate(-50%, -100%) rotate(0deg);
      transform-origin: 50% 100%;
      transition: transform 150ms linear;
    }
    .needle::before, .needle::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
    }
    .needle::before {
      top: 0;
      border-bottom: 106px solid #ff4962;
      filter: drop-shadow(0 0 7px rgba(255,73,98,.85));
    }
    .needle::after {
      bottom: 0;
      border-top: 106px solid var(--cyan);
      filter: drop-shadow(0 0 7px rgba(49,233,255,.8));
    }
    .hub {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      width: 20px;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 3px solid var(--cyan-soft);
      border-radius: 50%;
      background: #06325a;
      box-shadow: 0 0 15px rgba(49,233,255,.8);
    }
    .readout {
      display: grid;
      gap: 3px;
      min-height: 83px;
      place-content: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(8,36,71,.72);
    }
    #degrees { color: var(--cyan); font-size: 2.05rem; font-weight: 700; line-height: 1; }
    #direction { font-size: .9rem; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; }
    #status {
      min-height: 2.5em;
      margin: 16px 10px;
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.35;
    }
    button {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid var(--cyan);
      border-radius: 10px;
      background: linear-gradient(135deg, #0b5e83, #0aa3c0);
      color: #001927;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(49,233,255,.24);
    }
    button:disabled { cursor: default; opacity: .72; }
    .note { margin: 15px 2px 0; color: #7192b2; font-size: .7rem; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">NEXUS</h1>
    <p class="tagline">Magnetic compass interface</p>

    <section class="compass" aria-label="Compass display">
      <span class="cardinal n">N</span><span class="cardinal e">E</span>
      <span class="cardinal s">S</span><span class="cardinal w">W</span>
      <div class="needle" id="needle" aria-hidden="true"></div>
      <div class="hub" aria-hidden="true"></div>
    </section>

    <section class="readout" aria-live="polite">
      <div id="degrees">--°</div>
      <div id="direction">Waiting</div>
    </section>
    <p id="status">Press Start Compass to connect your phone’s orientation sensor.</p>
    <button id="start" type="button">Start Compass</button>
    <p class="note">For the best result, use an HTTPS page on a phone with a magnetometer and keep it away from magnets or metal cases.</p>
  </main>

  <script>
    const needle = document.getElementById("needle");
    const degrees = document.getElementById("degrees");
    const direction = document.getElementById("direction");
    const status = document.getElementById("status");
    const startButton = document.getElementById("start");

    const labels = ["North", "North-East", "East", "South-East", "South", "South-West", "West", "North-West"];
    let started = false;
    let receivedAbsolute = false;
    let fallbackTimer;

    function normalise(angle) {
      return (angle % 360 + 360) % 360;
    }

    function showHeading(heading, source) {
      const angle = normalise(heading);
      degrees.textContent = Math.round(angle) + "°";
      direction.textContent = labels[Math.round(angle / 45) % 8];

      // The needle points north relative to the direction the top of the device faces.
      needle.style.transform = "translate(-50%, -100%) rotate(" + (-angle) + "deg)";
      status.textContent = source;
    }

    function isFiniteNumber(value) {
      return typeof value === "number" && Number.isFinite(value);
    }

    function handleAbsolute(event) {
      // Android browsers expose an Earth-referenced orientation through this event.
      // It is preferred over the generic event and is never replaced by relative data.
      if (!isFiniteNumber(event.alpha)) return;
      receivedAbsolute = true;
      clearTimeout(fallbackTimer);
      showHeading(360 - event.alpha, "Absolute orientation received.");
    }

    function handleFallback(event) {
      if (receivedAbsolute) return;

      // Safari's webkit value is an actual compass heading where it is available.
      if (isFiniteNumber(event.webkitCompassHeading)) {
        showHeading(event.webkitCompassHeading, "Magnetic heading received.");
        return;
      }

      // A generic orientation event can be absolute on some browsers.
      if (event.absolute === true && isFiniteNumber(event.alpha)) {
        showHeading(360 - event.alpha, "Absolute orientation received.");
        return;
      }

      // Relative alpha is useful for motion, but it is not a compass direction.
      status.textContent = "Relative orientation detected — no compass heading is available.";
    }

    async function startCompass() {
      if (started) return;

      if (!window.DeviceOrientationEvent) {
        status.textContent = "Device orientation is not supported by this browser.";
        return;
      }

      try {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== "granted") {
            status.textContent = "Sensor permission was not granted.";
            return;
          }
        }

        started = true;
        startButton.disabled = true;
        startButton.textContent = "Compass Active";
        status.textContent = "Looking for an absolute orientation sensor…";

        window.addEventListener("deviceorientationabsolute", handleAbsolute, true);

        // Some Android browsers never dispatch deviceorientationabsolute. Only then
        // use the general event, and only treat it as a heading when it says absolute.
        fallbackTimer = setTimeout(() => {
          if (!receivedAbsolute) {
            window.addEventListener("deviceorientation", handleFallback, true);
            status.textContent = "Checking orientation sensor…";
          }
        }, 900);
      } catch (error) {
        status.textContent = "Sensor error: " + (error.message || "could not start.");
      }
    }

    startButton.addEventListener("click", startCompass);
  </script>
</body>
</html>
